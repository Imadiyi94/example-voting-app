# =========================================================================
# Capstone 1 - The Voting App
# Phase 4: Production Automation and Delivery Pipelines
#
# PRD Section 3.4 mapping:
#   Task A - integrated functional test suites .......... job: test
#   Task B - integrated vulnerability analysis (Trivy) .. job: security
#   Task C - automatic registry authentication ......... job: publish (GHCR)
#   Task D - production build, short-SHA + latest tags .. job: publish
#   Secrets - supplied from GitHub encrypted secrets only
# =========================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  DOTNET_VERSION: "8.0.x"
  TRIVY_SEVERITY: CRITICAL

# -------------------------------------------------------------------------
# Task A - Integrated functional test suites
# -------------------------------------------------------------------------
jobs:
  test:
    name: "Task A - Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate vote service (dependencies + syntax)
        run: |
          python -m pip install --upgrade pip
          pip install -r vote/requirements.txt
          python -m py_compile vote/app.py

      - name: Validate result service (syntax)
        run: node --check result/server.js

      - name: Validate worker service (build)
        run: dotnet build worker/Worker.csproj -c Release

      - name: Materialise database secret for the compose stack
        run: |
          mkdir -p secrets
          printf '%s' "${DB_PASSWORD}" > secrets/db_password.txt
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'ci_test_password' }}

      - name: Start full stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for vote and result health endpoints
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:5001/health >/dev/null 2>&1; then
              echo "Stack healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Stack did not become healthy in time"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run integration test suite
        run: |
          pip install -r tests/integration/requirements.txt
          pytest tests/integration -v --junitxml=test-results/integration.xml

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

# -------------------------------------------------------------------------
# Task B - Integrated vulnerability analysis loops
# -------------------------------------------------------------------------
  security:
    name: "Task B - Trivy Scans"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build images for scanning
        run: |
          docker build -t voting-app-vote:scan ./vote
          docker build -t voting-app-worker:scan ./worker
          docker build -t voting-app-result:scan ./result

      - name: Trivy filesystem scan (vulnerabilities, secrets, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"

      - name: Trivy image scan - vote
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-vote:scan
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan - worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-worker:scan
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan - result
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app-result:scan
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore

# -------------------------------------------------------------------------
# Infrastructure validation (Terraform modules)
# -------------------------------------------------------------------------
  infrastructure:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.5"

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

# -------------------------------------------------------------------------
# Task C + D - Registry auth, production build, short-SHA + latest tags
# -------------------------------------------------------------------------
  publish:
    name: "Task C+D - Build & Push (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: [test, security, infrastructure]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [vote, worker, result]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compute lowercase image namespace
        id: image_ns
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels (sha-<short7>, branch, latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_ns.outputs.name }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Capstone 1 - The Voting App (${{ matrix.service }})
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true
