<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Voting App - Live Results</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            overflow: hidden;
        }
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 30px; 
            text-align: center; 
        }
        .header h1 { font-size: 32px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 16px; }
        .status { 
            padding: 15px 30px; 
            background: #f5f5f5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
        .status.connected { background: #e8f5e9; color: #2e7d32; }
        .status.disconnected { background: #ffebee; color: #c62828; }
        .content { padding: 30px; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 600px) { .results { grid-template-columns: 1fr; } }
        .option-card { 
            border-radius: 16px; 
            padding: 30px; 
            text-align: center; 
            position: relative;
            transition: all 0.3s ease;
        }
        .option-card.cats { background: linear-gradient(135deg, #fff3f3 0%, #ffeaea 100%); border: 2px solid #ffcccc; }
        .option-card.dogs { background: linear-gradient(135deg, #f0fdfd 0%, #e0f7f7 100%); border: 2px solid #b2dfdb; }
        .option-card.winner { transform: scale(1.02); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .option-icon { font-size: 64px; margin-bottom: 15px; display: block; }
        .option-label { font-size: 24px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .option-count { font-size: 72px; font-weight: 700; line-height: 1; color: #333; font-variant-numeric: tabular-nums; }
        .option-percent { font-size: 18px; color: #666; margin-top: 8px; }
        .winner-badge { 
            position: absolute; 
            top: -12px; 
            right: -12px; 
            background: #ffd700; 
            color: #333; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .total-votes { 
            text-align: center; 
            padding: 20px; 
            background: #f8f9fa; 
            border-radius: 12px; 
            margin-bottom: 30px;
        }
        .total-label { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .total-count { font-size: 36px; font-weight: 700; color: #333; margin-top: 5px; }
        .chart-container { height: 200px; position: relative; }
        .chart-bars { display: flex; align-items: flex-end; height: 100%; gap: 30px; justify-content: center; }
        .chart-bar { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; }
        .chart-bar-fill { 
            width: 100%; 
            border-radius: 8px 8px 0 0; 
            transition: height 0.5s ease; 
            min-height: 4px;
        }
        .chart-bar-fill.cats { background: linear-gradient(to top, #ff6b6b 0%, #ff8e8e 100%); }
        .chart-bar-fill.dogs { background: linear-gradient(to top, #4ecdc4 0%, #7ef7ef 100%); }
        .chart-bar-label { margin-top: 12px; font-weight: 600; color: #333; }
        .chart-bar-value { font-size: 14px; color: #666; margin-top: 4px; }
        .recent-votes { margin-top: 30px; }
        .recent-votes h3 { font-size: 18px; color: #333; margin-bottom: 15px; }
        .vote-list { max-height: 300px; overflow-y: auto; }
        .vote-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 12px 16px; 
            border-bottom: 1px solid #f0f0f0;
            animation: slideIn 0.3s ease;
        }
        .vote-item:last-child { border-bottom: none; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .vote-icon { font-size: 24px; width: 40px; text-align: center; }
        .vote-info { flex: 1; }
        .vote-voter { font-size: 12px; color: #999; font-family: monospace; }
        .vote-time { font-size: 12px; color: #999; }
        .footer { 
            text-align: center; 
            padding: 20px 30px; 
            background: #f8f9fa; 
            border-top: 1px solid #eee;
            color: #999; 
            font-size: 14px; 
        }
        .footer a { color: #667eea; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .connection-indicator { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            margin-right: 8px;
        }
        .connection-indicator.connected { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .connection-indicator.disconnected { background: #f44336; box-shadow: 0 0 8px #f44336; }
        .connection-indicator.connecting { background: #ff9800; box-shadow: 0 0 8px #ff9800; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Live Voting Results</h1>
            <p>Real-time vote tally from the Voting App</p>
        </div>
        
        <div class="status" id="status-bar">
            <div>
                <span class="connection-indicator connecting" id="conn-indicator"></span>
                <span id="conn-text">Connecting...</span>
            </div>
            <div id="last-update">Last update: --</div>
        </div>
        
        <div class="content">
            <div class="total-votes">
                <div class="total-label">Total Votes Cast</div>
                <div class="total-count" id="total-votes">0</div>
            </div>
            
            <div class="results" id="results">
                <div class="option-card cats" id="cats-card">
                    <span class="option-icon">🐱</span>
                    <div class="option-label">Cats</div>
                    <div class="option-count" id="cats-count">0</div>
                    <div class="option-percent" id="cats-percent">0%</div>
                </div>
                <div class="option-card dogs" id="dogs-card">
                    <span class="option-icon">🐶</span>
                    <div class="option-label">Dogs</div>
                    <div class="option-count" id="dogs-count">0</div>
                    <div class="option-percent" id="dogs-percent">0%</div>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-bars">
                    <div class="chart-bar">
                        <div class="chart-bar-fill cats" id="cats-bar" style="height: 0%"></div>
                        <div class="chart-bar-label">Cats</div>
                        <div class="chart-bar-value" id="cats-bar-value">0</div>
                    </div>
                    <div class="chart-bar">
                        <div class="chart-bar-fill dogs" id="dogs-bar" style="height: 0%"></div>
                        <div class="chart-bar-label">Dogs</div>
                        <div class="chart-bar-value" id="dogs-bar-value">0</div>
                    </div>
                </div>
            </div>
            
            <div class="recent-votes">
                <h3>Recent Votes</h3>
                <div class="vote-list" id="vote-list">
                    <div style="text-align: center; color: #999; padding: 20px;">Loading recent votes...</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <a href="http://localhost:5000" target="_blank">← Back to Vote</a>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = '';
        const POLL_INTERVAL = 2000; // 2 seconds fallback polling
        const MAX_RECENT_VOTES = 20;
        
        // State
        let eventSource = null;
        let socket = null;
        let pollTimer = null;
        let lastVoteCount = 0;
        
        // DOM elements
        const elements = {
            catsCount: document.getElementById('cats-count'),
            dogsCount: document.getElementById('dogs-count'),
            catsPercent: document.getElementById('cats-percent'),
            dogsPercent: document.getElementById('dogs-percent'),
            totalVotes: document.getElementById('total-votes'),
            catsBar: document.getElementById('cats-bar'),
            dogsBar: document.getElementById('dogs-bar'),
            catsBarValue: document.getElementById('cats-bar-value'),
            dogsBarValue: document.getElementById('dogs-bar-value'),
            catsCard: document.getElementById('cats-card'),
            dogsCard: document.getElementById('dogs-card'),
            voteList: document.getElementById('vote-list'),
            connIndicator: document.getElementById('conn-indicator'),
            connText: document.getElementById('conn-text'),
            lastUpdate: document.getElementById('last-update'),
            statusBar: document.getElementById('status-bar'),
        };
        
        // Initialize connection
        function initConnection() {
            // Try Server-Sent Events first
            try {
                eventSource = new EventSource('/events');
                
                eventSource.onopen = () => {
                    setConnectionStatus('connected', 'Live (SSE)');
                    stopPolling();
                };
                
                eventSource.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        if (message.type === 'init' || message.type === 'update') {
                            updateDisplay(message.data);
                        }
                    } catch (e) {
                        console.error('Error parsing SSE message:', e);
                    }
                };
                
                eventSource.onerror = () => {
                    setConnectionStatus('disconnected', 'SSE failed, trying WebSocket...');
                    eventSource.close();
                    initWebSocket();
                };
            } catch (e) {
                console.error('SSE not supported:', e);
                initWebSocket();
            }
        }
        
        // Initialize WebSocket as fallback
        function initWebSocket() {
            try {
                // Check if socket.io is available
                if (typeof io !== 'undefined') {
                    socket = io();
                    
                    socket.on('connect', () => {
                        setConnectionStatus('connected', 'Live (WebSocket)');
                        stopPolling();
                    });
                    
                    socket.on('voteUpdate', (data) => {
                        updateDisplay(data);
                    });
                    
                    socket.on('disconnect', () => {
                        setConnectionStatus('disconnected', 'WebSocket disconnected, falling back to polling...');
                        startPolling();
                    });
                    
                    socket.on('connect_error', () => {
                        setConnectionStatus('disconnected', 'WebSocket failed, using polling...');
                        startPolling();
                    });
                } else {
                    startPolling();
                }
            } catch (e) {
                console.error('WebSocket error:', e);
                startPolling();
            }
        }
        
        // Fallback polling
        function startPolling() {
            if (pollTimer) return;
            setConnectionStatus('connecting', 'Polling...');
            pollTimer = setInterval(fetchVotes, POLL_INTERVAL);
            fetchVotes(); // Initial fetch
        }
        
        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }
        
        async function fetchVotes() {
            try {
                const response = await fetch('/api/votes');
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                updateDisplay(data);
                setConnectionStatus('connected', 'Polling');
            } catch (err) {
                console.error('Polling error:', err);
                setConnectionStatus('disconnected', 'Polling failed');
            }
        }
        
        // Update UI with vote data
        function updateDisplay(data) {
            const cats = data.Cats || 0;
            const dogs = data.Dogs || 0;
            const total = cats + dogs;
            
            // Update counts with animation
            animateValue(elements.catsCount, cats);
            animateValue(elements.dogsCount, dogs);
            animateValue(elements.totalVotes, total);
            
            // Update percentages
            const catsPercent = total > 0 ? Math.round((cats / total) * 100) : 0;
            const dogsPercent = total > 0 ? Math.round((dogs / total) * 100) : 0;
            elements.catsPercent.textContent = `${catsPercent}%`;
            elements.dogsPercent.textContent = `${dogsPercent}%`;
            
            // Update bars (max height 100%)
            const maxHeight = 150; // px
            const catsHeight = total > 0 ? (cats / total) * 100 : 0;
            const dogsHeight = total > 0 ? (dogs / total) * 100 : 0;
            elements.catsBar.style.height = `${catsHeight}%`;
            elements.dogsBar.style.height = `${dogsHeight}%`;
            elements.catsBarValue.textContent = cats;
            elements.dogsBarValue.textContent = dogs;
            
            // Update winner highlight
            elements.catsCard.classList.toggle('winner', cats > dogs);
            elements.dogsCard.classList.toggle('winner', dogs > cats);
            
            // Update last update time
            elements.lastUpdate.textContent = `Last update: ${new Date().toLocaleTimeString()}`;
            
            // Fetch recent votes if total changed
            if (total !== lastVoteCount && total > 0) {
                fetchRecentVotes();
                lastVoteCount = total;
            }
        }
        
        // Animate number counting
        function animateValue(element, target) {
            const current = parseInt(element.textContent) || 0;
            if (current === target) return;
            
            const duration = 500;
            const startTime = performance.now();
            const difference = target - current;
            
            function animate(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
                const value = Math.round(current + difference * eased);
                element.textContent = value;
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Fetch recent votes
        async function fetchRecentVotes() {
            try {
                const response = await fetch(`/api/votes/recent?limit=${MAX_RECENT_VOTES}`);
                if (!response.ok) throw new Error('Failed to fetch recent votes');
                const votes = await response.json();
                renderRecentVotes(votes);
            } catch (err) {
                console.error('Error fetching recent votes:', err);
            }
        }
        
        // Render recent votes list
        function renderRecentVotes(votes) {
            if (!votes || votes.length === 0) {
                elements.voteList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">No votes yet</div>';
                return;
            }
            
            elements.voteList.innerHTML = votes.map(vote => `
                <div class="vote-item">
                    <span class="vote-icon">${vote.vote === 'Cats' ? '🐱' : '🐶'}</span>
                    <div class="vote-info">
                        <div class="vote-voter">${vote.voter_id.substring(0, 8)}...</div>
                    </div>
                    <span class="vote-time">${formatTime(new Date(vote.created_at))}</span>
                </div>
            `).join('');
        }
        
        // Format time for display
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
            return date.toLocaleDateString();
        }
        
        // Update connection status UI
        function setConnectionStatus(status, text) {
            elements.connIndicator.className = `connection-indicator ${status}`;
            elements.connText.textContent = text;
            elements.statusBar.className = `status ${status === 'connected' ? 'connected' : status === 'disconnected' ? 'disconnected' : ''}`;
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initConnection();
            fetchRecentVotes();
        });
        
        // Cleanup on unload
        window.addEventListener('beforeunload', () => {
            if (eventSource) eventSource.close();
            if (socket) socket.disconnect();
            if (pollTimer) clearInterval(pollTimer);
        });
    </script>
    
    <!-- Socket.io client (loaded from CDN) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</body>
</html>
