{{- /*
Optional ServiceAccount. Off by default because Terraform owns the identity
and RBAC for the application; enable for a standalone Helm-only install.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
{{- end }}
